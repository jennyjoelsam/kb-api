name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q

  docker:
    # Proves the Dockerfile builds and the container really serves requests.
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kb-api .
      - name: Run container and check it works
        run: |
          docker run -d --name kb -p 8000:8000 kb-api
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/documents \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI check","content":"hello from ci","tags":["ci"]}'
          curl -sf "http://localhost:8000/search?q=hello" | grep "CI check"
      - name: Show container logs on failure
        if: failure()
        run: docker logs kb
